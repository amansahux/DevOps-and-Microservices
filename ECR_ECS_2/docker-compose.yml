
services:
  server:
    build: ./server
    ports:
      - "3000:3000"
    volumes:
      - ./server:/app
      - server_node_modules:/app/node_modules
    command: npx nodemon -L server.js

  client:
    build: ./client
    ports:
      - "5173:5173"
    volumes:
      - ./client:/app
      - client_node_modules:/app/node_modules
    command: npm run dev -- --host 0.0.0.0

volumes:
  server_node_modules:
  client_node_modules:
