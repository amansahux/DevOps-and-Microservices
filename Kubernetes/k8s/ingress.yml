apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: demo-ingress
  labels:
    app.kubernetes.io/name: demo-ingress
spec:
  rules:

    - http:
        paths:
        - pathType: Prefix
          path: "/"
          backend:
            service:
              name: kuber-demo-service
              port: 
                number: 80
