apiVersion: apps/v1
kind: Deployment
metadata:
  name: express-deployement
spec:
  replicas: 2
  selector:
    matchLabels:
      app: myapp
  template:
    metadata:
      labels:
        app: myapp
        owner: aman
    spec:
      containers:
      - name: myapp
        image: kuber-learning:latest
        imagePullPolicy: IfNotPresent
        resources:
          limits:
            memory: "128Mi"
            cpu: "500m"
          requests: 
            memory: "64Mi"
            cpu: "250m"
        ports:
        - containerPort: 3000
